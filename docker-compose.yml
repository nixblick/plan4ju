# Local development and test services (db, mailpit) plus the optional `app` profile (image build,
# migrations, app). For production put a reverse proxy with HTTPS in front, see README.
# Secrets come from the environment (.env, see .env.example); nothing is hard-coded.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plan4ju}
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-plan4ju_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set POSTGRES_OWNER_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - plan4ju-db:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.21.8
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-58025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-51025}:1025"

  # Profile "app": docker compose --profile app up -d --build
  migrate:
    profiles: ["app"]
    build: { context: ., target: migrate }
    image: plan4ju-migrate
    depends_on:
      db: { condition: service_healthy }
    environment: &appdb
      DATABASE_URL: postgresql://plan4ju_app:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-plan4ju}
      DATABASE_ADMIN_URL: postgresql://${POSTGRES_OWNER_USER:-plan4ju_owner}:${POSTGRES_OWNER_PASSWORD}@db:5432/${POSTGRES_DB:-plan4ju}
    restart: "no"

  app:
    profiles: ["app"]
    build: { context: ., target: runner }
    image: plan4ju-app
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      <<: *appdb
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL in .env}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      ANALYTICS_SCRIPT_URL: ${ANALYTICS_SCRIPT_URL:-}
      ANALYTICS_SITE: ${ANALYTICS_SITE:-}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  plan4ju-db:

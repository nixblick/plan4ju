name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint and typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://unused@localhost:5432/unused
          DATABASE_ADMIN_URL: postgresql://unused@localhost:5432/unused
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Vitest and Playwright
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Throwaway environment (random per run, never stored)
        run: |
          owner_pw=$(openssl rand -hex 16)
          app_pw=$(openssl rand -hex 16)
          echo "::add-mask::$owner_pw"
          echo "::add-mask::$app_pw"
          {
            echo "OWNER_PW=$owner_pw"
            echo "APP_PW=$app_pw"
            echo "DATABASE_URL=postgresql://plan4ju_app:${app_pw}@localhost:5432/plan4ju"
            echo "DATABASE_ADMIN_URL=postgresql://plan4ju_owner:${owner_pw}@localhost:5432/plan4ju"
            echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)"
            echo "BETTER_AUTH_URL=http://localhost:3000"
            echo "SMTP_URL=smtp://localhost:1025"
            echo "MAILPIT_UI_PORT=8025"
            echo "MAIL_FROM=Plan4JU <noreply@example.test>"
          } >> "$GITHUB_ENV"
      - name: Start PostgreSQL and Mailpit
        run: |
          docker run -d --name db --network host \
            -e POSTGRES_DB=plan4ju -e POSTGRES_USER=plan4ju_owner -e POSTGRES_PASSWORD="$OWNER_PW" \
            -e APP_DB_PASSWORD="$APP_PW" \
            -v "$PWD/docker/postgres-init:/docker-entrypoint-initdb.d:ro" \
            postgres:16-alpine
          docker run -d --name mailpit --network host axllent/mailpit:v1.21.8
          for i in $(seq 1 40); do
            docker exec db pg_isready -U plan4ju_owner -d plan4ju && break
            sleep 2
          done
          sleep 3
          docker exec db pg_isready -U plan4ju_owner -d plan4ju
      - run: npm ci
      - run: npx prisma generate
      - run: npm run db:migrate
      - run: npm test
      - run: npx playwright install --with-deps chromium-headless-shell
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          load: true
          tags: plan4ju-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: false
          tags: plan4ju-migrate:ci
          cache-from: type=gha
      - name: Image does not run as root
        run: test "$(docker run --rm --entrypoint id plan4ju-app:ci -u)" != "0"

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose
